[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mdo"
version = "0.1.0"
description = "Method of discrete singularities: steady and unsteady separated 2D flow around a thin contour"
requires-python = ">=3.9"
dependencies = ["numpy", "matplotlib"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = ["slow: long tests (full Lab 2 run, a few minutes)"]
